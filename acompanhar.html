<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>Acompanhar pedido — Hot Dog Wippel</title><link rel="stylesheet" href="/style.css"><style>body{background:#fff8f4}.trackWrap{max-width:720px;margin:0 auto;padding:18px}.trackCard{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.08);margin-top:18px}.trackTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.trackTop h1{margin:0 0 6px;font-size:25px}.muted{color:#6f6f6f}.steps{display:grid;gap:10px;margin:24px 0}.step{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#f4f4f4}.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#ddd;font-weight:700}.step.done{background:#edf8ef}.step.done .dot{background:#2e7d32;color:#fff}.step.current{outline:2px solid #c62828;background:#fff4f1}.step.current .dot{background:#c62828;color:#fff}.items{border-top:1px solid #eee;padding-top:14px}.item{padding:8px 0;border-bottom:1px solid #f0f0f0}.back{display:inline-block;margin-top:16px;text-decoration:none;font-weight:700}.pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.45}}@media(max-width:600px){.trackWrap{padding:12px}.trackCard{padding:16px}.trackTop{display:block}}</style></head><body><header class="hero"><div class="brandmark">🌭</div><div><h1>Hot Dog WIPPEL</h1><p>Acompanhe seu pedido</p></div></header><main class="trackWrap"><div class="trackCard"><div class="trackTop"><div><h1 id="title">Buscando pedido…</h1><p id="subtitle" class="muted pulse">Aguarde um instante.</p></div><b id="total"></b></div><div id="steps" class="steps"></div><div id="payment"></div><div id="items" class="items"></div><a class="back" href="/">← Voltar ao cardápio</a></div></main><script src="/acompanhar.js"></script></body></html>
